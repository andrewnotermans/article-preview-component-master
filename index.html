<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Article preview component</title>

  
</head>
<body>
  <article class="article-preview">
    <img class="article-preview__image" src="./images/drawers.jpg" alt="drawers"/>
    
    <div class="article-preview__content">
      <h2 class="article-preview__title">Shift the overall look and feel by adding these wonderful 
  touches to furniture in your home</h2>

      
      <p class="article-preview__description">Ever been in a room and felt like something was missing? Perhaps 
    it felt slightly bare and uninviting. I’ve got some simple tips 
    to help you make any room feel complete.</p>
      
      <footer class="article-preview__footer">
        <div class="author-info">
          <img class="author-info__avatar" src="./images/avatar-michelle.jpg" alt="avatar Michelle" />
          <div class="author-info__details">
            <h2 class="author-info__name">Michelle Appleton</h2>
            <time class="author-info__date">28 Jun 2020</time>            
          </div> 
        </div> 
        <button class="share-button" aria-label="Share article">
            <img src="./images/icon-share.svg" alt="Share icon">
        </button>
         
        
        
      </footer> 
    </div>  
  </article>
</body>
</html>
