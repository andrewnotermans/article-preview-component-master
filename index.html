<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Article preview component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="post-box">
    <h2 class="post-box__title">Shift the overall look and feel by adding these wonderful 
  touches to furniture in your home</h2>

      
    <p class="post-box__description">Ever been in a room and felt like something was missing? Perhaps 
  it felt slightly bare and uninviting. I’ve got some simple tips 
  to help you make any room feel complete.</p>

    <div class="post-box__footer">
      <img src="./images/avatar-michelle.jpg" alt="avatar Michelle" />
      <h2 class="post__author">Michelle Appleton</h2>
      <p class="post__datum">28 Jun 2020</p>
      <img src="./images/icon-share.svg" alt="Share icon">
    </div> 
  </div>
</body>
</html>
